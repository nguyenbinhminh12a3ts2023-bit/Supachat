name: supachat
description: "SupaChat - Realtime Messaging App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  provider: ^6.1.5+1
  image_picker: ^1.2.4
  intl: ^0.20.3
  cached_network_image: ^4.0.4
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.6
  file_picker: ^13.3.0
  audioplayers: ^6.8.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    - assets/images/
